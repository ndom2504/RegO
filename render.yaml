databases:
  - name: rego-db
    databaseName: rego
    user: rego

services:
  - type: web
    name: rego-ocean-factory
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn app_pro:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rego-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        value: 77831fb56cc4f6dc5721c0a70bb6c84d7a825c511154820954612c7fa7e48613
      - key: MICROSOFT_CLIENT_ID
        value: 0bf5e2d3-8bd8-4018-bb93-574036e9da92
      - key: MICROSOFT_CLIENT_SECRET
        value: OPQ8Q~3WNOXZN~~5XscPNc3JNqXRRvyV1D_gOblp
      - key: MICROSOFT_TENANT_ID
        value: common
