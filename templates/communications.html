<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre des Communications - RegO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            display: flex;
        }
        
        /* Sidebar (même style que dashboard) */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #1a5490 0%, #0d2d52 100%);
            color: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }
        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .sidebar-logo { width: 120px; height: auto; filter: brightness(0) invert(1); }
        .sidebar-menu { padding: 20px 0; }
        .menu-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            transition: all 0.3s;
        }
        .menu-item:hover, .menu-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
            border-left: 4px solid white;
        }
        .menu-item svg {
            width: 20px;
            height: 20px;
            margin-right: 12px;
        }
        
        /* Main content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 30px;
        }
        
        /* Header */
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #1a5490;
            font-size: 1.8em;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        
        /* Filtres */
        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            font-size: 0.85em;
            color: #666;
            font-weight: 600;
        }
        .filter-group input, .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95em;
            transition: all 0.3s;
        }
        .filter-group input:focus, .filter-group select:focus {
            outline: none;
            border-color: #1a5490;
        }
        
        /* Tableau */
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .table-header {
            padding: 20px 30px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header h2 {
            color: #1a5490;
            font-size: 1.2em;
        }
        .table-info {
            color: #666;
            font-size: 0.9em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: linear-gradient(135deg, #1a5490 0%, #0d2d52 100%);
            color: white;
        }
        th {
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        th:hover {
            background: rgba(255,255,255,0.1);
        }
        th.sortable::after {
            content: ' ⇅';
            opacity: 0.5;
        }
        th.sorted-asc::after {
            content: ' ↑';
            opacity: 1;
        }
        th.sorted-desc::after {
            content: ' ↓';
            opacity: 1;
        }
        tbody tr {
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s;
        }
        tbody tr:hover {
            background: #f9fbfd;
            transform: scale(1.002);
            box-shadow: 0 2px 8px rgba(26, 84, 144, 0.1);
        }
        td {
            padding: 15px 20px;
            color: #333;
            font-size: 0.9em;
        }
        td.subject {
            font-weight: 600;
            color: #1a5490;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        td.sender {
            color: #666;
        }
        td.date {
            color: #999;
            font-size: 0.85em;
        }
        td.category {
            font-weight: 600;
        }
        
        /* Tags */
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin: 2px;
        }
        .tag-important { background: #fed7d7; color: #9b2c2c; }
        .tag-urgent { background: #feebc8; color: #c05621; }
        .tag-normal { background: #c6f6d5; color: #276749; }
        .tag-info { background: #bee3f8; color: #2c5282; }
        
        /* Actions */
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            background: #f0f0f0;
            color: #666;
        }
        .btn-icon:hover {
            background: #1a5490;
            color: white;
            transform: scale(1.1);
        }
        .btn-icon svg {
            width: 16px;
            height: 16px;
        }
        
        /* Boutons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #1a5490, #0d2d52);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 84, 144, 0.3);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        /* Pagination */
        .pagination {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #f0f0f0;
        }
        .pagination-info {
            color: #666;
            font-size: 0.9em;
        }
        .pagination-controls {
            display: flex;
            gap: 5px;
        }
        .page-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .page-btn:hover {
            border-color: #1a5490;
            color: #1a5490;
        }
        .page-btn.active {
            background: #1a5490;
            color: white;
            border-color: #1a5490;
        }
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            color: #1a5490;
        }
        .close-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            color: #666;
        }
        .close-btn:hover {
            background: #e0e0e0;
        }
        .detail-row {
            margin-bottom: 15px;
        }
        .detail-label {
            font-weight: 600;
            color: #666;
            font-size: 0.85em;
            margin-bottom: 5px;
        }
        .detail-value {
            color: #333;
            padding: 10px;
            background: #f5f7fa;
            border-radius: 6px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state svg {
            width: 80px;
            height: 80px;
            opacity: 0.3;
            margin-bottom: 20px;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <svg class="sidebar-logo" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="25" width="60" height="50" rx="5" fill="none" stroke="currentColor" stroke-width="4"/>
                <polyline points="10,25 40,50 70,25" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
                <text x="85" y="65" font-family="'Segoe UI'" font-size="42" font-weight="bold" fill="currentColor">RegO</text>
            </svg>
        </div>
        <div class="sidebar-menu">
            <a href="/dashboard" class="menu-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Tableau de bord
            </a>
            <a href="/communications" class="menu-item active">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                Registre des Communications
            </a>
            <a href="/profile" class="menu-item">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Configuration
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header avec filtres -->
        <div class="header">
            <div class="header-top">
                <div>
                    <h1>Registre des Communications</h1>
                    <p style="color: #666; font-size: 0.9em; margin-top: 5px;">
                        Gérez et exportez vos communications professionnelles
                    </p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="syncEmails()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Synchroniser
                    </button>
                    <button class="btn btn-secondary" onclick="exportPDF()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Export PDF
                    </button>
                </div>
            </div>
            
            <!-- Filtres -->
            <div class="filters">
                <div class="filter-group">
                    <label>Recherche</label>
                    <input type="text" id="searchInput" placeholder="Sujet, expéditeur..." style="width: 250px;">
                </div>
                <div class="filter-group">
                    <label>Catégorie</label>
                    <select id="categoryFilter">
                        <option value="">Toutes</option>
                        <option value="Important">Important</option>
                        <option value="Urgent">Urgent</option>
                        <option value="Normal">Normal</option>
                        <option value="Info">Info</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Date de début</label>
                    <input type="date" id="startDate">
                </div>
                <div class="filter-group">
                    <label>Date de fin</label>
                    <input type="date" id="endDate">
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-secondary" onclick="resetFilters()">Réinitialiser</button>
                </div>
            </div>
        </div>

        <!-- Tableau -->
        <div class="table-container">
            <div class="table-header">
                <h2>Communications</h2>
                <span class="table-info" id="tableInfo">Chargement...</span>
            </div>
            
            <table id="communicationsTable">
                <thead>
                    <tr>
                        <th class="sortable" data-column="received_date">Date</th>
                        <th class="sortable" data-column="sender">Expéditeur</th>
                        <th class="sortable" data-column="subject">Sujet</th>
                        <th class="sortable" data-column="category">Catégorie</th>
                        <th>Tags</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px;">
                            <span class="spinner" style="width: 30px; height: 30px; border-width: 3px;"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="pagination">
                <div class="pagination-info" id="paginationInfo">0 communications</div>
                <div class="pagination-controls">
                    <button class="page-btn" onclick="changePage('prev')" id="prevBtn">‹</button>
                    <div id="pageNumbers"></div>
                    <button class="page-btn" onclick="changePage('next')" id="nextBtn">›</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal détails -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Détails de la communication</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let allCommunications = [];
        let filteredCommunications = [];
        let currentPage = 1;
        const itemsPerPage = 10;
        let sortColumn = 'received_date';
        let sortDirection = 'desc';

        // Charger les communications
        async function loadCommunications() {
            try {
                const response = await fetch('/api/communications/list');
                const data = await response.json();
                
                if (data.success) {
                    allCommunications = data.communications;
                    filteredCommunications = [...allCommunications];
                    renderTable();
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error('Erreur chargement:', error);
                showEmptyState();
            }
        }

        // Afficher le tableau
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = filteredCommunications.slice(start, end);
            
            if (pageData.length === 0) {
                showEmptyState();
                return;
            }
            
            tbody.innerHTML = pageData.map(comm => `
                <tr>
                    <td class="date">${new Date(comm.received_date).toLocaleDateString('fr-FR')}</td>
                    <td class="sender">${comm.sender}</td>
                    <td class="subject" title="${comm.subject}">${comm.subject}</td>
                    <td class="category">
                        <span class="tag tag-${(comm.category || 'normal').toLowerCase()}">${comm.category || 'Normal'}</span>
                    </td>
                    <td>
                        ${(comm.tags || []).map(tag => `<span class="tag tag-info">${tag}</span>`).join('')}
                    </td>
                    <td>
                        <div class="actions">
                            <button class="btn-icon" onclick="viewDetails(${comm.id})" title="Voir détails">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                            <button class="btn-icon" onclick="editCommunication(${comm.id})" title="Modifier">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </button>
                            <button class="btn-icon" onclick="deleteCommunication(${comm.id})" title="Supprimer">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            updatePagination();
            updateTableInfo();
        }

        // État vide
        function showEmptyState() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                            <h3>Aucune communication</h3>
                            <p>Synchronisez vos emails Outlook pour commencer</p>
                            <button class="btn btn-primary" onclick="syncEmails()" style="margin-top: 20px;">
                                Synchroniser maintenant
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }

        // Pagination
        function updatePagination() {
            const totalPages = Math.ceil(filteredCommunications.length / itemsPerPage);
            const pageNumbers = document.getElementById('pageNumbers');
            
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += '<span style="padding: 0 5px;">...</span>';
                }
            }
            pageNumbers.innerHTML = html;
            
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages || totalPages === 0;
        }

        function changePage(direction) {
            const totalPages = Math.ceil(filteredCommunications.length / itemsPerPage);
            if (direction === 'prev' && currentPage > 1) {
                currentPage--;
            } else if (direction === 'next' && currentPage < totalPages) {
                currentPage++;
            }
            renderTable();
        }

        function goToPage(page) {
            currentPage = page;
            renderTable();
        }

        function updateTableInfo() {
            const start = (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(start + itemsPerPage - 1, filteredCommunications.length);
            document.getElementById('tableInfo').textContent = 
                `${start}-${end} sur ${filteredCommunications.length} communications`;
            document.getElementById('paginationInfo').textContent = 
                `${filteredCommunications.length} communication${filteredCommunications.length > 1 ? 's' : ''}`;
        }

        // Tri
        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => {
                const column = th.dataset.column;
                if (sortColumn === column) {
                    sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
                } else {
                    sortColumn = column;
                    sortDirection = 'asc';
                }
                
                document.querySelectorAll('th.sortable').forEach(t => {
                    t.classList.remove('sorted-asc', 'sorted-desc');
                });
                th.classList.add(`sorted-${sortDirection}`);
                
                sortData();
            });
        });

        function sortData() {
            filteredCommunications.sort((a, b) => {
                let valA = a[sortColumn];
                let valB = b[sortColumn];
                
                if (sortColumn === 'received_date') {
                    valA = new Date(valA);
                    valB = new Date(valB);
                }
                
                if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
            
            currentPage = 1;
            renderTable();
        }

        // Filtres
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('categoryFilter').addEventListener('change', applyFilters);
        document.getElementById('startDate').addEventListener('change', applyFilters);
        document.getElementById('endDate').addEventListener('change', applyFilters);

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            filteredCommunications = allCommunications.filter(comm => {
                const matchSearch = !search || 
                    comm.subject.toLowerCase().includes(search) ||
                    comm.sender.toLowerCase().includes(search);
                const matchCategory = !category || comm.category === category;
                const matchStartDate = !startDate || new Date(comm.received_date) >= new Date(startDate);
                const matchEndDate = !endDate || new Date(comm.received_date) <= new Date(endDate);
                
                return matchSearch && matchCategory && matchStartDate && matchEndDate;
            });
            
            currentPage = 1;
            renderTable();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            applyFilters();
        }

        // Actions
        function viewDetails(id) {
            const comm = allCommunications.find(c => c.id === id);
            if (!comm) return;
            
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">Date</div>
                    <div class="detail-value">${new Date(comm.received_date).toLocaleString('fr-FR')}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Expéditeur</div>
                    <div class="detail-value">${comm.sender}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Destinataires</div>
                    <div class="detail-value">${(comm.recipients || []).join(', ') || 'N/A'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Sujet</div>
                    <div class="detail-value">${comm.subject}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Catégorie</div>
                    <div class="detail-value">
                        <span class="tag tag-${(comm.category || 'normal').toLowerCase()}">${comm.category || 'Normal'}</span>
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Tags</div>
                    <div class="detail-value">
                        ${(comm.tags || []).map(tag => `<span class="tag tag-info">${tag}</span>`).join(' ') || 'Aucun'}
                    </div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Notes</div>
                    <div class="detail-value">${comm.notes || 'Aucune note'}</div>
                </div>
            `;
            
            document.getElementById('detailModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function editCommunication(id) {
            alert(`Fonction d'édition pour ID: ${id} - À implémenter`);
        }

        async function deleteCommunication(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cette communication ?')) return;
            
            try {
                const response = await fetch(`/api/communications/${id}`, { method: 'DELETE' });
                const data = await response.json();
                
                if (data.success) {
                    await loadCommunications();
                } else {
                    alert('Erreur: ' + data.error);
                }
            } catch (error) {
                alert('Erreur de suppression');
            }
        }

        async function syncEmails() {
            const btn = event.target;
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Synchronisation...';
            
            try {
                const response = await fetch('/api/sync', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    alert(`${data.count} emails synchronisés!`);
                    await loadCommunications();
                } else {
                    alert('Erreur: ' + data.error);
                }
            } catch (error) {
                alert('Erreur de synchronisation');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        async function exportPDF() {
            const btn = event.target.closest('button');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Export...';
            
            try {
                const response = await fetch('/api/export-pdf');
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `registre_communications_${new Date().toISOString().split('T')[0]}.pdf`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
            } catch (error) {
                alert('Erreur lors de l\'export PDF');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', loadCommunications);
    </script>
</body>
</html>
