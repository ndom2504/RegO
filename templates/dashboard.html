<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegO - Dashboard de gestion des emails</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            align-items: center;
        }

        .status-badge {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge.authenticated {
            background: #10b981;
            color: white;
        }

        .status-badge.not-authenticated {
            background: #ef4444;
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .actions {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .actions h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .emails-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .emails-section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .email-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .email-item {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .email-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .email-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .email-subject {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
            flex: 1;
        }

        .email-badges {
            display: flex;
            gap: 5px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .badge-unread {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-read {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-attachment {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-important {
            background: #fee2e2;
            color: #991b1b;
        }

        .email-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .email-preview {
            color: #888;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            background: #10b981;
            color: white;
        }

        .notification.error {
            background: #ef4444;
            color: white;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- En-tête -->
        <div class="header">
            <h1>📧 RegO Dashboard</h1>
            <p>Gestionnaire de registre des emails Outlook</p>
            <div class="status-bar">
                <div class="status-badge not-authenticated" id="authStatus">
                    🔒 Non authentifié
                </div>
                <div style="color: #666;">
                    Email: <strong id="userEmail">-</strong>
                </div>
            </div>
        </div>

        <!-- Statistiques -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total d'emails</h3>
                <div class="value" id="totalEmails">0</div>
            </div>
            <div class="stat-card">
                <h3>Non lus</h3>
                <div class="value" id="unreadEmails">0</div>
            </div>
            <div class="stat-card">
                <h3>Avec pièces jointes</h3>
                <div class="value" id="attachmentEmails">0</div>
            </div>
            <div class="stat-card">
                <h3>Importants</h3>
                <div class="value" id="importantEmails">0</div>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <h2>Actions</h2>
            <div class="button-group">
                <button class="btn-primary" onclick="authenticate()">
                    🔐 S'authentifier
                </button>
                <button class="btn-success" onclick="showFetchModal()" id="btnFetch" disabled>
                    📥 Récupérer les emails
                </button>
                <button class="btn-warning" onclick="exportPDF()" id="btnExport" disabled>
                    📄 Exporter en PDF
                </button>
                <button class="btn-danger" onclick="clearRegistry()">
                    🗑️ Effacer le registre
                </button>
                <button class="btn-primary" onclick="refreshData()">
                    🔄 Rafraîchir
                </button>
            </div>
        </div>

        <!-- Liste des emails -->
        <div class="emails-section">
            <h2>Emails (<span id="emailCount">0</span>)</h2>
            <div id="emailList" class="email-list">
                <div class="loading">Aucun email dans le registre</div>
            </div>
        </div>
    </div>

    <!-- Modal pour récupérer les emails -->
    <div class="modal" id="fetchModal">
        <div class="modal-content">
            <h3>Récupérer les emails</h3>
            <div class="input-group">
                <label for="emailLimit">Nombre d'emails à récupérer:</label>
                <input type="number" id="emailLimit" value="100" min="1" max="1000">
            </div>
            <div class="input-group">
                <label>
                    <input type="checkbox" id="overwriteEmails">
                    Remplacer les emails existants
                </label>
            </div>
            <div class="button-group">
                <button class="btn-success" onclick="fetchEmails()">Récupérer</button>
                <button class="btn-danger" onclick="closeFetchModal()">Annuler</button>
            </div>
        </div>
    </div>

    <script>
        // État de l'application
        let isAuthenticated = false;

        // Charger l'état au démarrage
        window.addEventListener('load', () => {
            refreshData();
        });

        // Afficher une notification
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 4000);
        }

        // Rafraîchir les données
        async function refreshData() {
            try {
                // Charger le statut
                const statusRes = await fetch('/api/status');
                const status = await statusRes.json();

                isAuthenticated = status.authenticated;
                document.getElementById('userEmail').textContent = status.user_email || '-';

                // Mettre à jour le badge d'authentification
                const authStatus = document.getElementById('authStatus');
                if (isAuthenticated) {
                    authStatus.className = 'status-badge authenticated';
                    authStatus.textContent = '✅ Authentifié';
                    document.getElementById('btnFetch').disabled = false;
                } else {
                    authStatus.className = 'status-badge not-authenticated';
                    authStatus.textContent = '🔒 Non authentifié';
                    document.getElementById('btnFetch').disabled = true;
                }

                // Mettre à jour les statistiques
                document.getElementById('totalEmails').textContent = status.stats.total;
                document.getElementById('unreadEmails').textContent = status.stats.unread;
                document.getElementById('attachmentEmails').textContent = status.stats.with_attachments;
                document.getElementById('importantEmails').textContent = status.stats.importance.high || 0;

                // Activer/désactiver le bouton d'export
                document.getElementById('btnExport').disabled = status.stats.total === 0;

                // Charger les emails
                loadEmails();
            } catch (error) {
                console.error('Erreur lors du rafraîchissement:', error);
            }
        }

        // Authentification
        async function authenticate() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '⏳ Authentification...';

            try {
                const response = await fetch('/api/authenticate', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    showNotification('✅ ' + data.message, 'success');
                    await refreshData();
                } else {
                    showNotification('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔐 S\'authentifier';
            }
        }

        // Afficher le modal de récupération
        function showFetchModal() {
            document.getElementById('fetchModal').classList.add('active');
        }

        // Fermer le modal de récupération
        function closeFetchModal() {
            document.getElementById('fetchModal').classList.remove('active');
        }

        // Récupérer les emails
        async function fetchEmails() {
            const limit = document.getElementById('emailLimit').value;
            const overwrite = document.getElementById('overwriteEmails').checked;

            closeFetchModal();

            const emailList = document.getElementById('emailList');
            emailList.innerHTML = '<div class="loading"><div class="spinner"></div>Récupération des emails...</div>';

            try {
                const response = await fetch('/api/fetch-emails', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ limit: parseInt(limit), overwrite })
                });
                const data = await response.json();

                if (data.success) {
                    showNotification(`✅ ${data.count} emails récupérés`, 'success');
                    await refreshData();
                } else {
                    showNotification('❌ ' + data.error, 'error');
                    loadEmails();
                }
            } catch (error) {
                showNotification('❌ Erreur: ' + error.message, 'error');
                loadEmails();
            }
        }

        // Charger la liste des emails
        async function loadEmails() {
            try {
                const response = await fetch('/api/emails');
                const data = await response.json();

                const emailList = document.getElementById('emailList');
                const emailCount = document.getElementById('emailCount');

                if (data.success && data.emails.length > 0) {
                    emailCount.textContent = data.count;
                    emailList.innerHTML = data.emails.map((email, index) => `
                        <div class="email-item">
                            <div class="email-header">
                                <div class="email-subject">${email.subject}</div>
                                <div class="email-badges">
                                    ${email.is_read ? '<span class="badge badge-read">Lu</span>' : '<span class="badge badge-unread">Non lu</span>'}
                                    ${email.has_attachments ? '<span class="badge badge-attachment">📎</span>' : ''}
                                    ${email.importance === 'high' ? '<span class="badge badge-important">!</span>' : ''}
                                </div>
                            </div>
                            <div class="email-meta">
                                <strong>${email.sender.name}</strong> &lt;${email.sender.email}&gt; 
                                • ${email.received_date}
                            </div>
                            <div class="email-preview">${email.preview}</div>
                        </div>
                    `).join('');
                } else {
                    emailCount.textContent = '0';
                    emailList.innerHTML = '<div class="loading">Aucun email dans le registre</div>';
                }
            } catch (error) {
                console.error('Erreur lors du chargement des emails:', error);
            }
        }

        // Exporter en PDF
        async function exportPDF() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '⏳ Génération du PDF...';

            try {
                const response = await fetch('/api/export-pdf', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    showNotification('✅ ' + data.message, 'success');
                    
                    // Télécharger le PDF
                    window.location.href = `/api/download-pdf/${data.filename}`;
                } else {
                    showNotification('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '📄 Exporter en PDF';
            }
        }

        // Effacer le registre
        async function clearRegistry() {
            if (!confirm('Êtes-vous sûr de vouloir effacer tous les emails du registre ?')) {
                return;
            }

            try {
                const response = await fetch('/api/clear-registry', {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    showNotification('✅ ' + data.message, 'success');
                    await refreshData();
                } else {
                    showNotification('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Erreur: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
